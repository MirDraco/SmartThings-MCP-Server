services:
  smartthings-mcp:
    build: .
    image: smartthings-mcp-server:latest
    container_name: smartthings-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container runs in HTTP mode so the NanoClaw agent can connect over the network.
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
